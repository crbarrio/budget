<div
    class="grid grid-cols-[1fr_auto] items-center gap-x-4 gap-y-4 md:grid-cols-[minmax(0,1fr)_12rem_auto] md:gap-x-10 md:gap-y-6">

    <div class="col-span-2 min-w-0 md:col-span-1">
        <h2 class="card-header">{{ service().name }}</h2>
        <p class="text-slate-700 font-bold">
            {{ service().description }}
        </p>
    </div>

    <div class="self-center md:min-w-54 md:justify-self-center md:text-center">
        <span class="text-3xl font-extrabold sm:text-4xl">{{ service().price }}</span>
        <span class="text-lg font-bold sm:text-xl"> €</span>
    </div>

    <div class="self-center justify-self-end md:justify-self-auto">
        <label for="service-{{ service().id }}" class="inline-flex cursor-pointer items-center select-none">
            <span class="relative inline-flex items-center justify-center">
                <input 
                    type="checkbox" 
                    name="service-{{ service().id }}" 
                    id="service-{{ service().id }}"
                    class="peer sr-only"
                    (change)="onChangeService($event)"
                    [attr.aria-expanded]="service().subservices ? isSelected() : null"
                    [attr.aria-controls]="service().subservices ? 'subservices-' + service().id : null"
                 />
                <span
                    class="h-5 w-5 rounded border border-gray-300 bg-white peer-checked:border-emerald-500 peer-checked:bg-emerald-500"></span>
                <svg class="absolute h-3 w-3 text-white opacity-0 peer-checked:opacity-100" viewBox="0 0 20 20"
                    fill="none" stroke="currentColor" stroke-width="4">
                    <path d="M4 10l4 4 8-8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </span>
            <span class="ml-3 font-bold">Añadir</span>
        </label>
    </div>

</div>

@if (service().subservices && isSelected()) {
  <div
    id="subservices-{{ service().id }}"
    class="grid overflow-hidden text-sm transition-all duration-300 ease-out"
    [class.grid-rows-[1fr]]="isSelected()"
    [class.grid-rows-[0fr]]="!isSelected()"
    [class.opacity-100]="isSelected()"
    [class.opacity-0]="!isSelected()"
    [class.pointer-events-none]="!isSelected()"
  >
    <div class="min-h-0">
      <div class="space-y-2 pt-8">
        @for (subservice of service().subservices; track subservice.id) {
          <app-subservice-item
            [subservice]="subservice"
            [quantity]="subserviceQuantities[subservice.id] ?? 1"
            (quantityChanged)="updateSubservice(subservice.id, $event)"
          ></app-subservice-item>
        }
      </div>
    </div>
  </div>

}
